name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check structure and tracked artefacts
        run: python tools/check_repo_hygiene.py

  selftests:
    name: cad/scripts self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --quiet numpy scipy matplotlib
      - name: Run self-tests
        env:
          MPLBACKEND: Agg
        run: python tools/run_python_selftests.py

  volare-suite:
    name: volare package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install --quiet numpy scipy matplotlib
      - name: Verify (physics, invariants, build, audit, functional)
        working-directory: powertrain/python/volare
        env:
          MPLBACKEND: Agg
        run: python verify.py

  matlab-portability:
    name: MATLAB sources - portability and stage gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Octave
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends octave
      - name: Parse and portability check
        run: octave --no-gui --quiet tools/octave_check.m
      - name: Propulsor build-stage gates
        working-directory: propulsor
        run: octave --no-gui --quiet tests/ci.m

  blender:
    name: Blender scene builders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and numpy for its Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends blender python3-numpy
      - name: Build every scene
        run: |
          set -e
          blender -b -P cad/blender/build_scene.py -- --out cad/out/ci_baseline.blend
          blender -b -P cad/blender/frame_redesign.py
          blender -b -P cad/blender/parametric_scene.py
          blender -b -P cad/blender/build_powertrain.py
          blender -b -P cad/blender/build_full_assembly.py
