name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check structure and tracked artefacts
        run: python tools/check_repo_hygiene.py

  selftests:
    name: cad/scripts self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --quiet numpy scipy matplotlib
      - name: Run self-tests
        env:
          MPLBACKEND: Agg
        run: python tools/run_python_selftests.py

  volare-suite:
    name: volare package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install --quiet numpy scipy matplotlib
      - name: Verify (physics, invariants, build, audit, functional)
        working-directory: powertrain/python/volare
        env:
          MPLBACKEND: Agg
        run: python verify.py
